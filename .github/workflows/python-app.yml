name: Bot Telegram Pronote

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Permet de déclencher le bot automatiquement régulièrement (ex: toutes les heures)
  schedule:
    - cron: '0 * * * *'
  # Permet d'exécuter le script manuellement depuis GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pronotepy python-telegram-bot

    - name: Lancer le script du bot
      env:
        # Configuration des variables d'environnement sécurisées (Secrets GitHub)
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        PRONOTE_URL: ${{ secrets.PRONOTE_URL }}
        PRONOTE_USERNAME: ${{ secrets.PRONOTE_USERNAME }}
        PRONOTE_PASSWORD: ${{ secrets.PRONOTE_PASSWORD }}
      run: |
        python bot.py
